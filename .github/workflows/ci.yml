name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run tests
        run: yarn test:run

      - name: Build shadcn registry
        run: yarn build:registry

      - name: Build app and Storybook
        run: |
          yarn build
          yarn build:storybook
